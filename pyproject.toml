[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # GFS wind, temperature and rain arrive as GRIB2 (gaia/feeds/gfs.py). The
    # eccodes wheel pulls in eccodeslib, a binary build for amd64 and arm64,
    # so the image needs no system ecCodes.
    "eccodes>=2.39",
    "fastapi>=0.115",
    "httpx>=0.28",
    # Cloud and weather textures are built as arrays and written as PNGs.
    "numpy>=2.0",
    "Pillow>=10",
    # The TV renderer (gaia/stream.py) drives headless Chromium. Imported only
    # when streaming is on, so the web side runs without a browser installed.
    "playwright>=1.48",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["gaia*"]

[tool.setuptools.package-data]
# gaia/web/ is read from disk, not imported. Globbed by directory so a new
# asset can't silently miss the wheel.
gaia = ["web/*", "web/*/*", "web/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["gaia/web/vendor"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["–", "×", "’", "−"]

[tool.ruff.lint.isort]
known-first-party = ["gaia"]
