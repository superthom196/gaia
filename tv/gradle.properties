# Needs JDK 17+. If Gradle can't find a JDK, set org.gradle.java.home in your
# own ~/.gradle/gradle.properties (not this file, which is committed).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djdk.tls.client.protocols=TLSv1.2
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
